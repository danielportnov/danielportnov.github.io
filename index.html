<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel Portnov — Under Construction</title>
  <meta name="description" content="Daniel Portnov. New site under construction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="tape tape-top" aria-hidden="true"></div>
  <div class="tape tape-bottom" aria-hidden="true"></div>

  <div class="floor" aria-hidden="true">
    <div class="floor-grid"></div>
  </div>

  <main class="stage">
    <svg class="crane" viewBox="0 0 280 220" fill="none" aria-hidden="true">
      <g class="crane-tower">
        <rect x="118" y="78" width="14" height="128" fill="#1c2433"/>
        <path d="M118 78 L132 78 L132 206 L118 206 Z" stroke="#e8b44c" stroke-width="1.2" opacity="0.85"/>
        <path d="M118 96 H132 M118 114 H132 M118 132 H132 M118 150 H132 M118 168 H132 M118 186 H132" stroke="#e8b44c" stroke-width="1" opacity="0.55"/>
        <path d="M118 78 L132 96 M132 78 L118 96 M118 114 L132 132 M132 114 L118 132 M118 150 L132 168 M132 150 L118 168" stroke="#e8b44c" stroke-width="0.8" opacity="0.4"/>
        <rect x="108" y="202" width="34" height="8" rx="1" fill="#e8b44c"/>
      </g>
      <g class="crane-jib">
        <path d="M40 78 H248" stroke="#d9c48a" stroke-width="4" stroke-linecap="square"/>
        <path d="M40 74 H248" stroke="#e8b44c" stroke-width="1.4"/>
        <path d="M125 78 L248 78 L132 42 Z" fill="#e8b44c" opacity="0.12"/>
        <path d="M132 42 L248 78" stroke="#e8b44c" stroke-width="1.5"/>
        <path d="M132 42 L40 78" stroke="#c9a227" stroke-width="1.2" opacity="0.7"/>
        <circle cx="132" cy="42" r="4" fill="#e8b44c"/>
        <rect x="236" y="72" width="18" height="14" fill="#e8b44c"/>
        <rect x="36" y="70" width="10" height="16" fill="#9a7b2c"/>
      </g>
      <g class="hook-group">
        <line class="cable" x1="210" y1="78" x2="210" y2="128" stroke="#cfc6a8" stroke-width="1.4"/>
        <g class="payload">
          <rect x="196" y="128" width="28" height="22" rx="1" fill="#1b3054" stroke="#e8b44c" stroke-width="1.2"/>
          <path d="M196 136 H224 M204 128 V150 M216 128 V150" stroke="#e8b44c" stroke-width="0.7" opacity="0.6"/>
        </g>
      </g>
    </svg>

    <p class="kicker">danielportnov.com</p>
    <h1>Under<br>Construction</h1>
    <p class="lede">A new site is going up. Check back soon.</p>

    <div class="progress" role="status" aria-live="polite">
      <div class="progress-meta">
        <span class="status-dot"></span>
        <span id="status-label">assembling scaffolding</span>
        <span id="status-pct">18%</span>
      </div>
      <div class="bar">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
    </div>

    <nav class="links">
      <a href="https://linkedin.com/in/danielportnov" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://github.com/danielportnov" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:danny.portnov@gmail.com">Email</a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
